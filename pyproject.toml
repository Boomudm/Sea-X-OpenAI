[project]
name = "trongpok"
version = "0.1.0"
description = "Evidence-based review queue for storage listing options"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=2.8.0,<3",
    "pydantic>=2.9.0,<3",
    "streamlit>=1.52,<2",
]

[project.scripts]
trongpok-read = "trongpok.cli:main"
trongpok-analyze = "trongpok.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trongpok"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "trongpok/profile_data"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
